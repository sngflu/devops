---
- name: Создание директории для проекта
  file:
    path: /opt/myproject
    state: directory
    mode: "0755"

- name: Создание временного архива проекта
  shell: tar --exclude='.git' --exclude='*.iso' --exclude='*.img' --exclude='.terraform' -czf /tmp/project.tar.gz -C {{ playbook_dir }}/.. .
  delegate_to: localhost
  become: no

- name: Копирование архива на ВМ
  copy:
    src: /tmp/project.tar.gz
    dest: /tmp/project.tar.gz
    mode: "0644"

- name: Создание директории для проекта
  file:
    path: /opt/myproject
    state: directory
    mode: "0755"

- name: Распаковка проекта на ВМ
  shell: tar -xzf /tmp/project.tar.gz -C /opt/myproject
  args:
    executable: /bin/bash

- name: Удаление временного архива
  file:
    path: /tmp/project.tar.gz
    state: absent
  become: yes

- name: Настройка DNS-серверов
  copy:
    content: |
      nameserver 8.8.8.8
      nameserver 8.8.4.4
      nameserver 1.1.1.1
    dest: /etc/resolv.conf
    mode: "0644"
  become: yes

- name: Проверка DNS-соединения
  shell: nslookup pypi.org
  register: dns_check
  become: yes
  ignore_errors: yes

- name: Вывод результатов DNS-проверки
  debug:
    var: dns_check

- name: Настройка netplan для использования DNS Google
  copy:
    content: |
      network:
        version: 2
        ethernets:
          enp0s3:
            dhcp4: true
            nameservers:
              addresses: [8.8.8.8, 8.8.4.4]
          enp0s8:
            dhcp4: false
            addresses: [192.168.56.10/24]
            nameservers:
              addresses: [8.8.8.8, 8.8.4.4]
    dest: /etc/netplan/01-netcfg.yaml
    mode: "0644"
  become: yes

- name: Применение netplan конфигурации
  shell: netplan apply
  become: yes

- name: Установка pip docker-compose plugin
  pip:
    name: docker-compose
    state: present
  become: yes

- name: Увеличение таймаута Docker для pull операций
  copy:
    content: |
      {
        "registry-mirrors": [],
        "max-concurrent-downloads": 10,
        "max-concurrent-uploads": 10,
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "dns": ["8.8.8.8", "8.8.4.4"],
        "dns-search": [],
        "mtu": 1500,
        "default-address-pools": [
          {
            "base": "172.17.0.0/16",
            "size": 24
          }
        ]
      }
    dest: /etc/docker/daemon.json
    mode: "0644"
  become: yes

- name: Перезапуск Docker для применения настроек
  systemd:
    name: docker
    state: restarted
  become: yes

- name: Удаление возможных прокси-настроек из окружения
  blockinfile:
    path: /etc/environment
    block: |
      # Удаление любых прокси-настроек
      unset http_proxy
      unset https_proxy
      unset ftp_proxy
      unset no_proxy
      unset HTTP_PROXY
      unset HTTPS_PROXY
      unset FTP_PROXY
      unset NO_PROXY
    state: present
    create: yes
  become: yes

- name: Создание docker service директории
  file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"
  become: yes

- name: Удаление proxy.conf если существует
  file:
    path: /etc/systemd/system/docker.service.d/proxy.conf
    state: absent
  become: yes

- name: Перезагрузка daemon-reload
  systemd:
    daemon_reload: yes
  become: yes

- name: Проверка интернет-соединения
  shell: curl -s https://www.google.com > /dev/null && echo "Internet connection OK" || echo "No internet connection"
  register: internet_check
  become: yes

- name: Проверка доступа к Docker Hub
  shell: curl -s https://registry-1.docker.io/v2/ > /dev/null && echo "Docker Hub OK" || echo "Docker Hub not accessible"
  register: dockerhub_check
  become: yes
  ignore_errors: yes

- name: Вывод результатов проверки Docker Hub
  debug:
    var: dockerhub_check

- name: Оптимизация сетевых настроек
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  with_items:
    - { key: "net.ipv4.tcp_fin_timeout", value: "30" }
    - { key: "net.ipv4.tcp_keepalive_time", value: "1200" }
    - { key: "net.ipv4.tcp_max_syn_backlog", value: "8192" }
    - { key: "net.ipv4.tcp_tw_reuse", value: "1" }
  become: yes
  ignore_errors: yes

- name: Вывод результатов проверки интернета
  debug:
    var: internet_check

- name: Установка директории для хранения данных
  file:
    path: /opt/myproject/storage
    state: directory
    mode: "0755"
  become: yes

- name: Предварительное скачивание Docker образов
  shell: docker pull postgres:15-alpine && docker pull dpage/pgadmin4:7.8 && docker pull bitnami/minio:2023.11.20
  register: docker_pull_result
  become: yes
  retries: 3
  delay: 10
  until: docker_pull_result.rc == 0
  ignore_errors: yes

- name: Запуск docker-compose
  shell: cd /opt/myproject && docker-compose up -d
  register: compose_up_result
  become: yes
  retries: 3
  delay: 10
  until: compose_up_result.rc == 0
  ignore_errors: yes

- name: Вывод результата запуска docker-compose
  debug:
    var: compose_up_result

- name: Проверка статуса запущенных контейнеров
  shell: docker ps
  register: docker_ps_result
  become: yes

- name: Вывод статуса контейнеров
  debug:
    var: docker_ps_result
