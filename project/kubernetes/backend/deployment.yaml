apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app-namespace
spec:
  replicas: 1  # Начальное количество реплик
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: sanchous1000/backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5174
        env:
        - name: USE_MINIO
          value: "true"
        - name: MINIO_ENDPOINT
          value: "minio:9000"
        - name: MINIO_ACCESS_KEY
          value: "minioadmin"
        - name: MINIO_SECRET_KEY
          value: "minioadmin"
        - name: MINIO_SECURE
          value: "false"
        - name: MODEL_PATH
          value: "/app/app/utils/yolov8nv2_e200_bs16.pt"
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: "pguser"
        - name: POSTGRES_PASSWORD
          value: "pgpassword"
        - name: POSTGRES_DB
          value: "pgdatabase"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "pguser"
        - name: DB_PASSWORD
          value: "pgpassword"
        - name: DB_NAME
          value: "pgdatabase"
        - name: DEBUG
          value: "True"
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          tcpSocket:
            port: 5174
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 5174
          initialDelaySeconds: 30
          periodSeconds: 10 