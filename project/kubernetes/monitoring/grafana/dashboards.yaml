apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: lab4-app
  labels:
    grafana_dashboard: "1"
data:
  dashboards.yaml: |-
    apiVersion: 1
    providers:
      - name: 'kubernetes'
        orgId: 1
        folder: 'Kubernetes'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
