---
- name: Настройка Docker VM
  hosts: docker-host
  become: yes
  
  tasks:
    - name: Установка дополнительных пакетов
      apt:
        name: 
          - git
          - python3-pip
          - nano
          - wget
        state: present
        update_cache: yes
      
    - name: Создание директории для проекта
      file:
        path: /home/vagrant/app
        state: directory
        owner: vagrant
        group: vagrant
        
    - name: Проверка статуса Docker
      service:
        name: docker
        state: started
        enabled: yes
        
    - name: Клонирование проекта из git (если есть)
      git:
        repo: "https://github.com/username/repo.git"
        dest: /home/vagrant/app
        version: main
      become: yes
      become_user: vagrant
      ignore_errors: yes
        
    - name: Создание тестового Docker-compose файла
      copy:
        dest: /home/vagrant/app/docker-compose.yml
        content: |
          version: '3'
          
          services:
            webapp:
              image: nginx:alpine
              ports:
                - "80:80"
              volumes:
                - ./html:/usr/share/nginx/html
              restart: always
          
            api:
              image: python:3.9-alpine
              command: sh -c "pip install flask && python -m flask run --host=0.0.0.0"
              ports:
                - "8000:5000"
              volumes:
                - ./api:/app
              working_dir: /app
              environment:
                FLASK_APP: app.py
                FLASK_ENV: development
              restart: always
        owner: vagrant
        group: vagrant
        
    - name: Создание тестовой HTML страницы
      file:
        path: /home/vagrant/app/html
        state: directory
        owner: vagrant
        group: vagrant
        
    - name: Создание тестовой HTML страницы
      copy:
        dest: /home/vagrant/app/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>Лабораторная работа №2</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 40px;
                line-height: 1.6;
              }
              h1 {
                color: #333;
              }
            </style>
          </head>
          <body>
            <h1>Лабораторная работа №2</h1>
            <p>Docker контейнер успешно развернут с помощью Vagrant и Ansible!</p>
          </body>
          </html>
        owner: vagrant
        group: vagrant
    
    - name: Создание тестового API
      file:
        path: /home/vagrant/app/api
        state: directory
        owner: vagrant
        group: vagrant
        
    - name: Создание файла Flask приложения
      copy:
        dest: /home/vagrant/app/api/app.py
        content: |
          from flask import Flask, jsonify
          
          app = Flask(__name__)
          
          @app.route('/')
          def hello():
              return jsonify({
                  "message": "Привет от API!",
                  "status": "success",
                  "lab": "Лабораторная работа №2"
              })
          
          if __name__ == '__main__':
              app.run(host='0.0.0.0')
        owner: vagrant
        group: vagrant 